# Blueprint do Render — https://render.com/docs/blueprint-spec
services:
  # Landing page (site estático, plano gratuito)
  - type: web
    name: pasi-landing-page
    runtime: static
    rootDir: landing-page
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Só refaz o deploy quando algo da landing page mudar
    buildFilter:
      paths:
        - landing-page/**
    envVars:
      # Vite 8 exige Node 20.19+ / 22.12+
      - key: NODE_VERSION
        value: "22"
      # E-mail exibido na seção de contato (definido no painel do Render)
      - key: VITE_CONTACT_EMAIL
        sync: false
      # API da assistente digital (serviço pasi-bot-api, abaixo). Sem esta variável,
      # o site usa o endereço padrão definido em src/components/Assistente/api.ts.
      # Se o Render criar o serviço com um sufixo na URL, ajuste aqui e no api.ts.
      - key: VITE_ASSISTENTE_API_URL
        value: https://pasi-bot-api.onrender.com

  # API da assistente digital (PASIBot: FastAPI + LangGraph, plano gratuito:
  # hiberna após ~15 min sem acesso; a primeira resposta pode levar ~1 min)
  - type: web
    name: pasi-bot-api
    runtime: python
    plan: free
    rootDir: pasi_bot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    buildFilter:
      paths:
        - pasi_bot/**
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: LLM_PROVEDOR
        value: groq
      # Chaves secretas: digitadas no painel do Render, nunca no repositório
      - key: GROQ_API_KEY
        sync: false
      - key: MONGO_URL
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      # Separa os traces do Render dos locais (filtro Environment no Langfuse)
      - key: LANGFUSE_TRACING_ENVIRONMENT
        value: producao
      - key: LANGFUSE_BASE_URL
        value: https://cloud.langfuse.com

  # Painel web do profissional (React + Vite, site estático, plano gratuito)
  - type: web
    name: pasi-web-dev
    runtime: static
    # Raiz do monorepo: o package-lock.json dos workspaces fica aqui
    buildCommand: npm ci --workspace apps/web && npm run web:build
    staticPublishPath: apps/web/dist
    buildFilter:
      paths:
        - apps/web/**
        - package.json
        - package-lock.json
    # SPA: toda rota cai no index.html (o React Router resolve no navegador)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Endereço público da pasi-api, com /api no fim
      - key: VITE_API_URL
        sync: false

  # API NestJS (plano gratuito: hiberna após ~15 min sem acesso e o disco
  # é efêmero — arquivos em uploads/ somem a cada deploy/reinício)
  - type: web
    name: pasi-api
    runtime: node
    plan: free
    # Raiz do monorepo: o package-lock.json dos workspaces fica aqui
    buildCommand: npm ci --workspace apps/api && npm run prisma:generate --workspace apps/api && npm run api:build
    startCommand: npm run api:start
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - apps/api/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Strings do Neon: "pooled" em DATABASE_URL e a direta em DIRECT_URL
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      # Base do link de redefinição de senha (legado; use WEB_URL)
      - key: APP_URL
        sync: false
      # Endereço do painel web: base do link "redefinir senha" e do botão
      # "Acessar o PASI" nos e-mails
      - key: WEB_URL
        sync: false
      # Brevo (API HTTPS de e-mail transacional; o Render free bloqueia SMTP).
      # A chave fica só no painel do Render — nunca no repositório.
      - key: BREVO_API_KEY
        sync: false
      # Remetente validado no Brevo
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: PASI
